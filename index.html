<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Printer Status</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand-line">WEISSMAN FOUNDRY @ BABSON COLLEGE</div>
        <h1>&gt; printer_status<span class="cursor">_</span></h1>
      </div>
      <div class="sync-box">
        AVAILABLE NOW <span class="big" id="available-count">— / 9</span>
        LAST SYNC <span class="big" id="last-sync">—</span>
      </div>
    </header>

f    <main class="cabinet">
      <div class="post post-left"></div>
      <div class="post post-right"></div>
      <section class="shelf-row" id="shelf-row-1"></section>
      <div class="shelf-board"></div>
      <section class="shelf-row" id="shelf-row-2"></section>
      <div class="shelf-board"></div>
      <section class="shelf-row" id="shelf-row-3"></section>
      <div class="shelf-board"></div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
